[package]
name = "cupel-coding-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The only bin left in this package, so `cargo run -p cupel-coding-agent`
# starts it (it rewrites catalog.json). cupel itself: `cargo run --bin cupel`.
[[bin]]
name = "generate-catalog"
path = "src/bin/generate_catalog/main.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
cupel-agent.workspace = true
cupel-core.workspace = true
futures-util.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
# For the bounded ollama /api/tags discovery probe at startup, the
# dev-time generate-catalog bin (models.dev fetch), and the update check.
reqwest.workspace = true
# Release versions compare as semver: 0.10.0 is newer than 0.9.0.
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
# The SHA-256 of a downloaded release archive (update.rs).
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-util.workspace = true
unicode-normalization.workspace = true

[lints]
workspace = true
