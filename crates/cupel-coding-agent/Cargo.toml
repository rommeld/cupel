[package]
name = "cupel-coding-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The only bin left in this package, so running this package with Cargo
# starts it (it rewrites catalog.json). cupel itself, running the cupel binary with Cargo.
[[bin]]
name = "generate-catalog"
path = "src/bin/generate_catalog/main.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
cupel-agent.workspace = true
cupel-core.workspace = true
futures-util.workspace = true
getrandom.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
percent-encoding.workspace = true
pulldown-cmark.workspace = true
# For the bounded ollama /api/tags discovery probe at startup, the
# dev time generate catalog bin (models.dev fetch), and the update check.
reqwest.workspace = true
# Release versions compare as semver, 0.10.0 is newer than 0.9.0.
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
# The SHA 256 of a downloaded release archive (update.rs).
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-util.workspace = true
unicode-normalization.workspace = true
yaml_serde.workspace = true

[target.'cfg(unix)'.dependencies]
process-wrap = { version = "11", default-features = false, features = ["tokio1", "process-session"] }
rustix = { version = "1.1", features = ["process"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { version = "0.32", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
cupel-macos-process = { path = "../cupel-macos-process" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
