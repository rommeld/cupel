# Linux binaries use musl, macOS binaries contain Apple Silicon and Intel slices.

name: release

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  queue: max

jobs:
  prepare:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Prepare release from PR comments
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag=$(python3 packaging/prepare-merge-release.py)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Push release tag
        if: steps.metadata.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          gh auth setup-git
          git push origin "refs/tags/$RELEASE_TAG"

  build:
    needs: prepare
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
      (needs.prepare.result == 'success' && needs.prepare.outputs.tag != '')) }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: cupel-macos-universal
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: cupel-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: cupel-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag && format('refs/tags/{0}', needs.prepare.outputs.tag) || github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Verify prepared release metadata
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "error: tag $RELEASE_TAG does not match workspace version $version" >&2
            exit 1
          fi
          grep -Fq "## [$RELEASE_TAG] - " CHANGELOG.md

      - name: Install musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release -p cupel-tui -p cupel-acp --target aarch64-apple-darwin
          cargo build --locked --release -p cupel-tui -p cupel-acp --target x86_64-apple-darwin
          for binary in cupel cupel-acp; do
            lipo -create \
              target/aarch64-apple-darwin/release/$binary \
              target/x86_64-apple-darwin/release/$binary \
              -output "$binary"
            # Put the input first and verify slices separately across Xcode versions.
            lipo "$binary" -verify_arch arm64
            lipo "$binary" -verify_arch x86_64
          done

      - name: Build (Linux musl)
        if: runner.os == 'Linux'
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --release -p cupel-tui -p cupel-acp --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/{cupel,cupel-acp} .

      - name: Package
        run: |
          tar -czf ${{ matrix.artifact }}.tar.gz cupel cupel-acp LICENSE README.md \
            -C crates/cupel-acp examples
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > sha256sums.txt

      - name: Verify release archive and clean installation
        run: python3 packaging/check-release.py ${{ matrix.artifact }}.tar.gz sha256sums.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum cupel-*.tar.gz > sha256sums.txt

      - name: Publish GitHub release
        working-directory: dist
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft \
              --title "cupel $RELEASE_TAG" --generate-notes --verify-tag
          fi
          gh release upload "$RELEASE_TAG" cupel-*.tar.gz sha256sums.txt --clobber
          id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)
          gh api --method PATCH "repos/$GH_REPO/releases/$id" -F draft=false -f make_latest=legacy --silent
