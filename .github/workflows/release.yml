# Release pipeline: push a tag like `v0.1.0` and this builds per-platform
# binaries and attaches them to a GitHub Release. Users install with the
# repo's install.sh (or by downloading an archive) - no Rust required.
# After the release, CHANGELOG.md and workspace versions are updated on main
# (see `changelog` job) and the Homebrew tap is bumped (see `homebrew` job).
#
# Platform notes:
# - macOS ships one universal binary (arm64 + x86_64 via lipo), so there is
#   no "which Mac do I have" question.
# - Linux builds against musl, statically linking libc: one binary runs on
#   any distro regardless of glibc version.
# - aarch64 Linux builds natively on GitHub's free arm runners
#   (ubuntu-24.04-arm) instead of cross-compiling - no cross toolchain to
#   maintain.
# - No Windows yet: the bash tool is Unix-only (process groups, `kill`).
#
# Maintenance alternative: `cargo-dist` generates this whole pipeline plus
# installers from Cargo.toml metadata. This file is hand-rolled so the
# machinery stays visible; migrating later is a drop-in replacement.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: cupel-macos-universal
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: cupel-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: cupel-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set workspace version from release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: release tag '$RELEASE_TAG' must be vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi
          version=${RELEASE_TAG#v}

          # The tag is the source of truth for release binaries, including
          # CARGO_PKG_VERSION. Only rewrite the inherited workspace version.
          awk -v v="$version" '
            /^\[workspace\.package\]/ { inpkg = 1 }
            /^\[/ && !/^\[workspace\.package\]/ { inpkg = 0 }
            inpkg && /^version = / && !done { print "version = \"" v "\""; done = 1; next }
            { print }
            END { if (!done) exit 1 }
          ' Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

          # Refresh workspace versions without upgrading locked dependencies.
          cargo update --workspace

      - name: Install musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p cupel-tui --target aarch64-apple-darwin
          cargo build --release -p cupel-tui --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/cupel \
            target/x86_64-apple-darwin/release/cupel \
            -output cupel

      - name: Build (Linux musl)
        if: runner.os == 'Linux'
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release -p cupel-tui --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/cupel cupel

      - name: Package
        run: |
          tar -czf ${{ matrix.artifact }}.tar.gz cupel LICENSE README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum cupel-*.tar.gz > sha256sums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            cupel-*.tar.gz sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "cupel $GITHUB_REF_NAME" \
            --generate-notes

  # Write the release back into CHANGELOG.md on main: a section listing the
  # commit subjects since the previous tag, generated by
  # packaging/update-changelog.sh. The same commit sets the workspace version
  # on main to the tag, so main agrees with the release binaries. Nothing else
  # can do that afterwards: pushes made with the default GITHUB_TOKEN
  # (workflow-level `contents: write` above) start no other workflow runs.
  changelog:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog commit lands on main, not on the tag this run was
          # triggered by; full history + tags are needed so the script can
          # find the previous tag and list the commits in between.
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Update CHANGELOG.md and workspace version
        run: |
          set -euo pipefail
          sh packaging/update-changelog.sh "$GITHUB_REF_NAME"

          # The build job validated the tag. Persist the same version on main
          # so local builds and their footer agree with the release binaries.
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^\[workspace\.package\]/ { inpkg = 1 }
            /^\[/ && !/^\[workspace\.package\]/ { inpkg = 0 }
            inpkg && /^version = / && !done { print "version = \"" v "\""; done = 1; next }
            { print }
            END { if (!done) exit 1 }
          ' Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
          cargo update --workspace

          git config user.name "cupel-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml Cargo.lock
          # A re-tagged release may leave all three files unchanged.
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "changelog: $GITHUB_REF_NAME"
          # Someone may have pushed to main since the checkout above. Replay
          # the commit on top of it instead of having the push rejected; a
          # real conflict still fails the job under `set -e`.
          git pull --rebase origin main
          git push

  # Bump the Homebrew tap to the release that was just published. Needs a
  # HOMEBREW_TAP_TOKEN repository secret (a fine-grained PAT with contents
  # read/write on the `homebrew-tap` repo) - the default GITHUB_TOKEN is
  # scoped to this repo and cannot push elsewhere. Without the secret this
  # job skips with a notice instead of failing the release.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN secret not set - skipping Homebrew tap update"
            exit 0
          fi

          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" -p sha256sums.txt
          sh packaging/update-formula.sh "${GITHUB_REF_NAME#v}" sha256sums.txt

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp packaging/homebrew/cupel.rb tap/Formula/cupel.rb
          cd tap
          git config user.name "cupel-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/cupel.rb
          # An unchanged formula (re-tagged release) is not an error.
          git commit -m "cupel $GITHUB_REF_NAME" || exit 0
          git push
