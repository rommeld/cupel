# Release pipeline: push a tag like `v0.1.0` and this builds per-platform
# cupel and cupel-acp binaries and attaches them to a GitHub Release. Users
# install with the repo's install.sh (or download an archive) - no Rust required.
# After the release, a PR updates CHANGELOG.md and workspace versions on main
# (see `changelog` job) and the Homebrew tap is bumped (see `homebrew` job).
#
# Platform notes:
# - macOS ships one universal binary (arm64 + x86_64 via lipo), so there is
#   no "which Mac do I have" question.
# - Linux builds against musl, statically linking libc: one binary runs on
#   any distro regardless of glibc version.
# - aarch64 Linux builds natively on GitHub's free arm runners
#   (ubuntu-24.04-arm) instead of cross-compiling - no cross toolchain to
#   maintain.
# - No Windows yet: the bash tool is Unix-only (process groups, `kill`).
#
# Maintenance alternative: `cargo-dist` generates this whole pipeline plus
# installers from Cargo.toml metadata. This file is hand-rolled so the
# machinery stays visible; migrating later is a drop-in replacement.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: cupel-macos-universal
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: cupel-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: cupel-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Set workspace version from release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: release tag '$RELEASE_TAG' must be vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi
          version=${RELEASE_TAG#v}

          # The tag is the source of truth for release binaries, including
          # CARGO_PKG_VERSION. Only rewrite the inherited workspace version.
          awk -v v="$version" '
            /^\[workspace\.package\]/ { inpkg = 1 }
            /^\[/ && !/^\[workspace\.package\]/ { inpkg = 0 }
            inpkg && /^version = / && !done { print "version = \"" v "\""; done = 1; next }
            { print }
            END { if (!done) exit 1 }
          ' Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

          # Refresh workspace versions without upgrading locked dependencies.
          cargo update --workspace

      - name: Install musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release -p cupel-tui -p cupel-acp --target aarch64-apple-darwin
          cargo build --locked --release -p cupel-tui -p cupel-acp --target x86_64-apple-darwin
          for binary in cupel cupel-acp; do
            lipo -create \
              target/aarch64-apple-darwin/release/$binary \
              target/x86_64-apple-darwin/release/$binary \
              -output "$binary"
            # Put the input first and verify slices separately across Xcode versions.
            lipo "$binary" -verify_arch arm64
            lipo "$binary" -verify_arch x86_64
          done

      - name: Build (Linux musl)
        if: runner.os == 'Linux'
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --release -p cupel-tui -p cupel-acp --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/{cupel,cupel-acp} .

      - name: Package
        run: |
          tar -czf ${{ matrix.artifact }}.tar.gz cupel cupel-acp LICENSE README.md \
            -C crates/cupel-acp examples
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > sha256sums.txt

      - name: Verify release archive and clean installation
        run: python3 packaging/check-release.py ${{ matrix.artifact }}.tar.gz sha256sums.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          overwrite: true

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ github.ref_name }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum cupel-*.tar.gz > sha256sums.txt

      - name: Publish or resume GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh ../packaging/publish-release.sh "$GITHUB_REF_NAME"

  # Propose CHANGELOG.md and workspace version updates through a PR so main's
  # protection rules remain enforced. Dispatch CI explicitly because PRs made
  # with GITHUB_TOKEN do not trigger pull_request workflows.
  changelog:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    concurrency:
      group: release-main-update
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Base the release-update PR on main. Full history + tags let the
          # script find the previous tag and list the commits in between.
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Propose CHANGELOG.md and workspace version update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh packaging/open-release-update.sh "$GITHUB_REF_NAME"

  # Bump the Homebrew tap to the release that was just published. Needs a
  # HOMEBREW_TAP_TOKEN repository secret (a fine-grained PAT with contents
  # read/write on the `homebrew-tap` repo) - the default GITHUB_TOKEN is
  # scoped to this repo and cannot push elsewhere. Without the secret this
  # job skips with a notice instead of failing the release.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: release-homebrew-update
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN secret not set - skipping Homebrew tap update"
            exit 0
          fi

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          if [ -f tap/Formula/cupel.rb ]; then
            current_version=$(awk -F '"' '/^  version "/ { print $2; exit }' tap/Formula/cupel.rb)
            update=$(python3 packaging/version-order.py "$GITHUB_REF_NAME" "$current_version")
            if [ "$update" != true ]; then
              echo "::notice::Skipping Homebrew update for older release $GITHUB_REF_NAME (tap is $current_version)"
              exit 0
            fi
          fi
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" -p sha256sums.txt
          sh packaging/update-formula.sh "${GITHUB_REF_NAME#v}" sha256sums.txt

          mkdir -p tap/Formula
          cp packaging/homebrew/cupel.rb tap/Formula/cupel.rb
          cd tap
          git config user.name "cupel-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/cupel.rb
          # An unchanged formula is the only successful no-op.
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "cupel $GITHUB_REF_NAME"
          git push
