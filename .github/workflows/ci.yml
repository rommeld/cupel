# CI: every push and pull request builds, lints, and tests the workspace on
# all runner architectures we ship. This is also the first place cupel compiles on
# Linux at all - the release pipeline depends on that staying true.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cupel-linux-x86_64
          - os: macos-latest
            artifact: cupel-macos-universal
          - os: ubuntu-24.04-arm
            artifact: cupel-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Packaging regression tests
        run: python3 -m unittest discover -s packaging -p 'test_*.py' -v
      - name: Verify packaged binaries and clean installation
        run: |
          cargo build --workspace --locked
          tar -czf "$RUNNER_TEMP/${{ matrix.artifact }}.tar.gz" \
            -C "$GITHUB_WORKSPACE/target/debug" cupel cupel-acp \
            -C "$GITHUB_WORKSPACE" LICENSE README.md \
            -C "$GITHUB_WORKSPACE/crates/cupel-acp" examples
          (cd "$RUNNER_TEMP" && shasum -a 256 ${{ matrix.artifact }}.tar.gz > sha256sums.txt)
          python3 packaging/check-release.py "$RUNNER_TEMP/${{ matrix.artifact }}.tar.gz" "$RUNNER_TEMP/sha256sums.txt"
